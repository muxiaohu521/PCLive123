<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLV.js 直播缓冲测试</title>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { background:#111; color:#eee; font-family:monospace; padding:16px }
h1 { font-size:18px; margin-bottom:12px; color:#ff9800 }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center }
.controls input[type=text] { flex:1; min-width:300px; padding:6px 10px; background:#222; border:1px solid #444; color:#eee; border-radius:4px; font-size:13px }
.controls select,.controls button { padding:6px 12px; border-radius:4px; font-size:13px; cursor:pointer }
.controls select { background:#222; border:1px solid #444; color:#eee }
.controls button { background:#ff9800; border:none; color:#111; font-weight:bold }
.controls button.danger { background:#e53935; color:#fff }
.controls button.green { background:#43a047; color:#fff }
.presets { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px }
.presets button { padding:4px 10px; border-radius:3px; border:1px solid #555; background:#222; color:#ccc; font-size:11px; cursor:pointer; white-space:nowrap }
.presets button.active { border-color:#ff9800; color:#ff9800; background:#2a2010 }
.video-area { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px }
.video-box { background:#000; position:relative; border-radius:6px; overflow:hidden; border:1px solid #333 }
.video-box .label { position:absolute; top:6px; left:8px; background:rgba(0,0,0,.7); padding:2px 8px; border-radius:3px; font-size:11px; z-index:5; pointer-events:none }
.video-box video { width:100%; display:block; min-height:200px }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px }
.stat-box { background:#1a1a1a; border:1px solid #333; border-radius:6px; padding:10px; font-size:12px }
.stat-box h3 { font-size:13px; margin-bottom:6px; color:#ff9800 }
.stat-row { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #222 }
.stat-row .val { color:#4caf50 }
.stat-row .warn { color:#ff9800 }
.stat-row .err { color:#e53935 }
.log-box { background:#0a0a0a; border:1px solid #333; border-radius:6px; padding:10px; margin-top:8px; max-height:200px; overflow-y:auto; font-size:11px }
.log-box .log-line { padding:2px 4px }
.log-box .info { color:#4caf50 }
.log-box .warn { color:#ff9800 }
.log-box .err { color:#e53935 }
.url-row { font-size:11px; color:#666; margin-bottom:4px; word-break:break-all }
</style>
</head>
<body>

<h1>FLV.js 直播缓冲测试 — 对比不同配置</h1>

<div class="controls">
  <input type="text" id="flvUrl" placeholder="输入 HTTP-FLV 直播流地址..." value="">
  <button onclick="loadBoth()">▶ 加载两个播放器</button>
  <button class="danger" onclick="destroyAll()">■ 全部停止</button>
</div>

<div class="presets">
  <span style="color:#888;font-size:11px;line-height:24px">预设URL:</span>
  <button onclick="setPreset('douyu')">斗鱼代理流 (epg)</button>
  <button onclick="setPreset('douyu2')">斗鱼代理流 (zzy)</button>
  <button onclick="setPreset('local')">手动输入</button>
</div>

<div class="url-row" id="urlInfo"></div>

<div class="video-area">
  <div class="video-box">
    <div class="label">播放器 A — isLive:false + 大stash</div>
    <video id="videoA" muted controls></video>
  </div>
  <div class="video-box">
    <div class="label">播放器 B — isLive:true + 低延迟</div>
    <video id="videoB" muted controls></video>
  </div>
</div>

<div class="stats">
  <div class="stat-box">
    <h3>播放器 A 状态 <span style="font-size:10px;color:#888">(isLive:false stash:64MB lazyLoad:false)</span></h3>
    <div class="stat-row"><span>缓冲时长</span><span class="val" id="statA-buffer">--</span></div>
    <div class="stat-row"><span>已下载</span><span class="val" id="statA-downloaded">--</span></div>
    <div class="stat-row"><span>下载速度</span><span class="val" id="statA-speed">--</span></div>
    <div class="stat-row"><span>ended次数</span><span class="val" id="statA-ended">0</span></div>
    <div class="stat-row"><span>error次数</span><span class="err" id="statA-errors">0</span></div>
    <div class="stat-row"><span>当前状态</span><span id="statA-state">停止</span></div>
  </div>
  <div class="stat-box">
    <h3>播放器 B 状态 <span style="font-size:10px;color:#888">(isLive:true stash:384KB lazyLoad:true)</span></h3>
    <div class="stat-row"><span>缓冲时长</span><span class="val" id="statB-buffer">--</span></div>
    <div class="stat-row"><span>已下载</span><span class="val" id="statB-downloaded">--</span></div>
    <div class="stat-row"><span>下载速度</span><span class="val" id="statB-speed">--</span></div>
    <div class="stat-row"><span>ended次数</span><span class="val" id="statB-ended">0</span></div>
    <div class="stat-row"><span>error次数</span><span class="err" id="statB-errors">0</span></div>
    <div class="stat-row"><span>当前状态</span><span id="statB-state">停止</span></div>
  </div>
</div>

<div class="log-box" id="logBox">
  <div class="log-line info">等待加载...</div>
</div>

<script>

const players = { A: null, B: null }
const videos = { A: document.getElementById('videoA'), B: document.getElementById('videoB') }
const stats = {
  A: { ended:0, errors:0, buffer:'--', downloaded:'--', speed:'--', state:'停止' },
  B: { ended:0, errors:0, buffer:'--', downloaded:'--', speed:'--', state:'停止' }
}
const intervals = { A: null, B: null }

function log(msg, type='info') {
  const box = document.getElementById('logBox')
  const line = document.createElement('div')
  line.className = 'log-line '+type
  line.textContent = new Date().toLocaleTimeString() + ' ' + msg
  box.appendChild(line)
  box.scrollTop = box.scrollHeight
}

function setPreset(type) {
  const input = document.getElementById('flvUrl')
  if (type === 'douyu') {
    input.value = 'http://epg.112114.xyz/douyu/9249162'
  } else if (type === 'douyu2') {
    input.value = 'http://zzy789.xyz/douyu1.php?id=9249162'
  } else {
    input.value = ''
  }
  document.querySelectorAll('.presets button').forEach(b=>b.classList.remove('active'))
  event.target.classList.add('active')
}

function formatBytes(b) { return b > 1048576 ? (b/1048576).toFixed(1)+'MB' : b > 1024 ? (b/1024).toFixed(1)+'KB' : b+'B' }
function formatSpeed(bps) { return bps > 1048576 ? (bps/1048576).toFixed(2)+' MB/s' : bps > 1024 ? (bps/1024).toFixed(0)+' KB/s' : bps.toFixed(0)+' B/s' }

function updateStats(id) {
  const v = videos[id]
  const el = (suffix) => document.getElementById('stat'+id+'-'+suffix)
  if (v.buffered.length > 0) {
    const end = v.buffered.end(v.buffered.length-1)
    const buf = (end - v.currentTime).toFixed(1)
    el('buffer').textContent = buf + 's'
    el('buffer').className = buf < 5 ? 'err' : buf < 15 ? 'warn' : 'val'
  } else {
    el('buffer').textContent = '--'
    el('buffer').className = 'val'
  }
  el('ended').textContent = stats[id].ended
  el('errors').textContent = stats[id].errors
  el('state').textContent = v.paused ? (v.ended ? '已结束' : '已暂停') : '播放中'
}

function monitorPlayer(id) {
  if (intervals[id]) clearInterval(intervals[id])
  intervals[id] = setInterval(() => updateStats(id), 2000)
}

function configA(url) {
  return {
    type: 'flv', url,
    isLive: false,
    hasAudio: true, hasVideo: true,
    cors: true, withCredentials: false,
    enableStashBuffer: true,
    stashInitialSize: 65536,
    enableWorker: true,
    // 关键：不要让lazyLoad限制缓冲
    lazyLoad: false,
    autoCleanupSourceBuffer: false,
  }
}

function configB(url) {
  return {
    type: 'flv', url,
    isLive: true,
    hasAudio: true, hasVideo: true,
    cors: true, withCredentials: false,
    enableStashBuffer: true,
    stashInitialSize: 384,
    enableWorker: true,
    lazyLoad: true,
    lazyLoadMaxDuration: 3*60,
    lazyLoadRecoverDuration: 30,
    autoCleanupSourceBuffer: true,
    autoCleanupMaxBackwardDuration: 120,
    autoCleanupMinBackwardDuration: 60,
  }
}

function createPlayer(id, getConfig) {
  const v = videos[id]
  const url = document.getElementById('flvUrl').value.trim()
  if (!url) { log('请输入FLV流地址', 'err'); return }

  // 先清理旧播放器
  destroyPlayer(id)

  if (!flvjs.isSupported()) { log('flv.js 不受此浏览器支持', 'err'); return }

  const cfg = getConfig(url)
  log(`[${id}] 创建播放器: isLive=${cfg.isLive} stashInitialSize=${cfg.stashInitialSize}KB lazyLoad=${cfg.lazyLoad}`, 'info')
  document.getElementById('urlInfo').textContent = '测试URL: ' + url

  const player = flvjs.createPlayer(cfg)
  players[id] = player

  player.on(flvjs.Events.ERROR, (e) => {
    stats[id].errors++
    log(`[${id}] ERROR: ${e}`, 'err')
    updateStats(id)
  })

  player.on(flvjs.Events.STATISTICS_INFO, (info) => {
    stats[id].speed = formatSpeed(info.speed)
    document.getElementById('stat'+id+'-speed').textContent = stats[id].speed
    if (info.totalReceiveLength) {
      stats[id].downloaded = formatBytes(info.totalReceiveLength)
      document.getElementById('stat'+id+'-downloaded').textContent = stats[id].downloaded
    }
  })

  player.on(flvjs.Events.LOADING_COMPLETE, () => {
    log(`[${id}] 下载完成 (LOADING_COMPLETE)`, 'warn')
  })

  player.on(flvjs.Events.MEDIA_INFO, (info) => {
    log(`[${id}] MEDIA_INFO: ${JSON.stringify(info)}`, 'info')
  })

  player.attachMediaElement(v)
  player.load()

  v.addEventListener('ended', () => {
    stats[id].ended++
    log(`[${id}] video ended (第${stats[id].ended}次)`, 'warn')
    updateStats(id)
  })

  v.addEventListener('waiting', () => {
    log(`[${id}] video waiting...`, 'warn')
  })

  v.addEventListener('playing', () => {
    log(`[${id}] video playing`, 'info')
  })

  v.addEventListener('canplay', () => {
    log(`[${id}] video canplay`, 'info')
  })

  v.play().catch(e => log(`[${id}] play failed: ${e.message}`, 'err'))
  monitorPlayer(id)
}

function destroyPlayer(id) {
  if (intervals[id]) { clearInterval(intervals[id]); intervals[id] = null }
  const p = players[id]
  if (p) {
    try { p.detachMediaElement(); p.destroy() } catch(_) {}
    players[id] = null
  }
  // 重置统计
  stats[id] = { ended:0, errors:0, buffer:'--', downloaded:'--', speed:'--', state:'停止' }
  updateStats(id)
}

function destroyAll() {
  destroyPlayer('A')
  destroyPlayer('B')
  log('全部停止', 'info')
}

function loadBoth() {
  log('=== 开始对比测试 ===', 'info')
  createPlayer('A', configA)
  setTimeout(() => createPlayer('B', configB), 500)
}

// 初始化预设
document.getElementById('flvUrl').value = 'http://epg.112114.xyz/douyu/9249162'
document.querySelector('.presets button:first-of-type + button')?.classList.add('active')

</script>
</body>
</html>
